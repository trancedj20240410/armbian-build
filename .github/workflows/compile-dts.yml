name: Compile & Validate Repository DTB (Kernel 6.6)

on:
  workflow_dispatch:

jobs:
  compile-dtb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler gcc-aarch64-linux-gnu wget tar xz-utils

      - name: Fetch and Extract Kernel 6.6 LTS Stable Headers
        run: |
          mkdir -p include/dt-bindings include/amlogic
          
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.157.tar.xz
          tar -xf linux-6.6.157.tar.xz
          
          cp -r linux-6.6.157/include/dt-bindings/* include/dt-bindings/
          cp -r linux-6.6.157/arch/arm64/boot/dts/amlogic/* include/amlogic/
          
          rm -rf linux-6.6.157*

      - name: Locate Target DTS
        id: locate-dts
        run: |
          DTS_PATH=$(find . -name "meson-g12b-a311ds-cainiao-xiaoyi-pros.dts" -print -quit)
          if [ -z "$DTS_PATH" ]; then
            echo "❌ Error: Cannot find meson-g12b-a311ds-cainiao-xiaoyi-pros.dts in repository."
            exit 1
          fi
          echo "Target DTS found at: $DTS_PATH"
          echo "dts_path=$DTS_PATH" >> $GITHUB_OUTPUT

      - name: Preprocess Device Tree Source
        run: |
          DTS_FILE="${{ steps.locate-dts.outputs.dts_path }}"
          
          aarch64-linux-gnu-gcc -E -nostdinc \
            -Iinclude \
            -Iinclude/amlogic \
            -I$(dirname "$DTS_FILE") \
            -x assembler-with-cpp \
            -undef -D__DTS__ "$DTS_FILE" -o processed_xiaoyi_pro.dts

      - name: Hard Check & Compile to DTB
        run: |
          dtc -I dts -O dtb -p 2048 \
            -W no-unit_address_vs_reg \
            -W no-avoid_default_addr_size \
            -o meson-g12b-a311ds-cainiao-xiaoyi-pros.dtb processed_xiaoyi_pro.dts

      - name: Archive and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYi-Pros-Optimized-DTB-Kernel6.6
          path: meson-g12b-a311ds-cainiao-xiaoyi-pros.dtb
          if-no-files-found: error
