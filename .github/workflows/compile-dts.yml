name: Compile & Validate Repository DTB

on:
  workflow_dispatch:

jobs:
  compile-dtb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler gcc-aarch64-linux-gnu wget tar

      - name: Fetch and Extract Kernel 6.1 LTS Stable Headers
        run: |
          mkdir -p include/dt-bindings
          
          # 🚀 终极修正：硬性锁定官方长期支持 6.1 分支归档包的绝对路径，确保 Actions 能 100% 下载成功
          wget https://kernel.org
          tar -xf linux-6.1.118.tar.xz
          
          # 精准搬运 6.1 环境下所有基础底层依赖资产
          cp -r linux-6.1.118/include/dt-bindings/* include/dt-bindings/
          cp linux-6.1.118/arch/arm64/boot/dts/amlogic/meson-g12b-a311d.dtsi include/
          cp linux-6.1.118/arch/arm64/boot/dts/amlogic/meson-g12b.dtsi include/
          cp linux-6.1.118/arch/arm64/boot/dts/amlogic/meson-g12-common.dtsi include/
          
          # 清理源码体积占用
          rm -rf linux-6.1.118*

      - name: Locate Target DTS
        id: locate-dts
        run: |
          DTS_PATH=$(find . -name "meson-g12b-a311ds-cainiao-xiaoyi-pros.dts" -print -quit)
          if [ -z "$DTS_PATH" ]; then
            echo "❌ Error: Cannot find meson-g12b-a311ds-cainiao-xiaoyi-pros.dts in repository."
            exit 1
          fi
          echo "Target DTS found at: $DTS_PATH"
          echo "dts_path=$DTS_PATH" >> $GITHUB_OUTPUT

      - name: Preprocess Device Tree Source
        run: |
          DTS_FILE="${{ steps.locate-dts.outputs.dts_path }}"
          
          # 使用预处理器对你维护在项目中的专属唯一源码进行 6.1 空间依赖融合
          aarch64-linux-gnu-gcc -E -nostdinc -Iinclude -I$(dirname "$DTS_FILE") -x assembler-with-cpp \
            -undef -D__DTS__ "$DTS_FILE" -o processed_xiaoyi_pro.dts

      - name: Hard Check & Compile to DTB
        run: |
          dtc -I dts -O dtb -p 2048 \
            -W no-unit_address_vs_reg \
            -W no-avoid_default_addr_size \
            -o meson-g12b-a311ds-cainiao-xiaoyi-pros.dtb processed_xiaoyi_pro.dts

      - name: Archive and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYi-Pros-Optimized-DTB
          path: meson-g12b-a311ds-cainiao-xiaoyi-pros.dtb
          if-no-files-found: error
